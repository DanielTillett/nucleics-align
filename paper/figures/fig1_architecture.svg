<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="350" fill="#ffffff"/>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 13px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #64748b; }
    .lbl { font-size: 10px; }
    .lblb { font-size: 10px; font-weight: 600; }
    .tick { font-size: 9.5px; fill: #334155; }
    .small { font-size: 8.8px; fill: #475569; }
  </style>

  <text x="20" y="24" class="title">Nucleics Align v1.3.0 — Exact Execution Dispatch Architecture</text>
  <text x="20" y="40" class="sub">All default matrix paths preserve byte-identical scalar Gotoh tie-breaking; --linear, --wfa and --fastlocal guarantee identical optimal scores.</text>
  <rect x="20" y="140" width="145" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="92.5" y="158" text-anchor="middle" class="lblb" style="fill:#2563eb">Pairwise Input</text>
  <text x="92.5" y="173" text-anchor="middle" class="small">DNA or protein (A, B)</text>
  <text x="92.5" y="186" text-anchor="middle" class="small">Affine scoring + matrix</text>
  <text x="92.5" y="199" text-anchor="middle" class="small">Checked C11 / CLI API</text>
  <rect x="215" y="56" width="175" height="58" rx="6" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.4"/>
  <text x="302.5" y="74" text-anchor="middle" class="lblb" style="fill:#0d9488">--wfa (BiWFA)</text>
  <text x="302.5" y="89" text-anchor="middle" class="small">O(s) trimmed fronts, 32B AVX2</text>
  <text x="302.5" y="102" text-anchor="middle" class="small">--wfabudget (auto &lt;= 2^28)</text>
  <rect x="215" y="130" width="175" height="58" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="302.5" y="148" text-anchor="middle" class="lblb" style="fill:#7c3aed">--linear (Hirschberg)</text>
  <text x="302.5" y="163" text-anchor="middle" class="small">O(|B|) rows, 16-bit + reuse</text>
  <text x="302.5" y="176" text-anchor="middle" class="small">Myers split rows (0/-1/0/-1)</text>
  <rect x="215" y="204" width="175" height="58" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="302.5" y="222" text-anchor="middle" class="lblb" style="fill:#d97706">--scoreonly</text>
  <text x="302.5" y="237" text-anchor="middle" class="small">Ukkonen-banded Myers (unit)</text>
  <text x="302.5" y="250" text-anchor="middle" class="small">or banded/MT striped SIMD</text>
  <rect x="215" y="278" width="175" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="302.5" y="296" text-anchor="middle" class="lblb" style="fill:#dc2626">smith_waterman --maxhits 1</text>
  <text x="302.5" y="311" text-anchor="middle" class="small">O(|B|) scans + lane hints</text>
  <text x="302.5" y="324" text-anchor="middle" class="small">8/16b strips or opt-in --fastlocal</text>
  <rect x="445" y="72" width="185" height="72" rx="6" fill="#f8fafc" stroke="#1b365d" stroke-width="1.4"/>
  <text x="537.5" y="90" text-anchor="middle" class="lblb" style="fill:#1b365d">1. Band Sizing &amp; Certificate</text>
  <text x="537.5" y="105" text-anchor="middle" class="small">Budgeted score-only WFA or 12-mer</text>
  <text x="537.5" y="118" text-anchor="middle" class="small">Strict S_out(b) &lt; L certificate</text>
  <text x="537.5" y="131" text-anchor="middle" class="small">Excludes tied paths outside B(b)</text>
  <rect x="445" y="170" width="185" height="72" rx="6" fill="#f8fafc" stroke="#1b365d" stroke-width="1.4"/>
  <text x="537.5" y="188" text-anchor="middle" class="lblb" style="fill:#1b365d">2. Striped Diff-Encoded Fill</text>
  <text x="537.5" y="203" text-anchor="middle" class="small">1-byte/cell traceback (12x RAM cut)</text>
  <text x="537.5" y="216" text-anchor="middle" class="small">8/16-bit diff lanes + prefix-scan</text>
  <text x="537.5" y="229" text-anchor="middle" class="small">64B padded condvar MT pipeline</text>
  <rect x="665" y="72" width="175" height="72" rx="6" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="752.5" y="90" text-anchor="middle" class="lblb" style="fill:#2563eb">Strip Pruning &amp; Strip-Kept</text>
  <text x="752.5" y="105" text-anchor="middle" class="small">Upper bound U(x,y) &lt; L pruning</text>
  <text x="752.5" y="118" text-anchor="middle" class="small">Auto strip-kept if &gt;25% RAM</text>
  <text x="752.5" y="131" text-anchor="middle" class="small">1 Mb 1% in 342 MiB (exact ties)</text>
  <rect x="665" y="170" width="175" height="72" rx="6" fill="#f8fafc" stroke="#1b365d" stroke-width="1.4"/>
  <text x="752.5" y="188" text-anchor="middle" class="lblb" style="fill:#1b365d">Exact Output &amp; Fallbacks</text>
  <text x="752.5" y="203" text-anchor="middle" class="small">Byte-identical Gotoh traceback</text>
  <text x="752.5" y="216" text-anchor="middle" class="small">Unsupported -&gt; 3-matrix scalar</text>
  <text x="752.5" y="229" text-anchor="middle" class="small">--linearfallback on OOM</text>
  <path d="M 165 176 L 190 176 L 190 85 L 213 85" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 165 176 L 190 176 L 190 159 L 213 159" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 165 176 L 190 176 L 190 233 L 213 233" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 165 176 L 190 176 L 190 305 L 213 305" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="85" x2="443" y2="102" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="416.5" y="89.5" text-anchor="middle" class="small">fallback</text>
  <path d="M 390 159 L 418 159 L 418 122 L 443 122" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="418" y="152" text-anchor="middle" class="small">default</text>
  <line x1="537" y1="144" x2="537" y2="168" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="544" y="159" text-anchor="start" class="small">band ok / full</text>
  <line x1="630" y1="108" x2="663" y2="108" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="646.5" y="104.0" text-anchor="middle" class="small">strips</text>
  <line x1="630" y1="206" x2="663" y2="206" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="752" y1="144" x2="752" y2="168" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
</svg>
