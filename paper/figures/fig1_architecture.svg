<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 365" width="860" height="365">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="365" fill="#ffffff"/>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 13px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #64748b; }
    .lbl { font-size: 10px; }
    .lblb { font-size: 10px; font-weight: 600; }
    .tick { font-size: 9.5px; fill: #334155; }
    .small { font-size: 8.8px; fill: #475569; }
  </style>

  <text x="20" y="24" class="title">Nucleics Align: Exact Execution Dispatch Architecture</text>
  <text x="20" y="40" class="sub">All default matrix paths preserve byte-identical scalar Gotoh tie-breaking; --linear, --wfa and --fastlocal guarantee identical optimal scores.</text>
  <rect x="16" y="152" width="142" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="87.0" y="170" text-anchor="middle" class="lblb" style="fill:#2563eb">Pairwise Input</text>
  <text x="87.0" y="185" text-anchor="middle" class="small">DNA or protein (A, B)</text>
  <text x="87.0" y="198" text-anchor="middle" class="small">Affine scoring + matrix</text>
  <text x="87.0" y="211" text-anchor="middle" class="small">Checked C11 / CLI API</text>
  <rect x="212" y="74" width="178" height="56" rx="6" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.4"/>
  <text x="301.0" y="92" text-anchor="middle" class="lblb" style="fill:#0d9488">--wfa (BiWFA)</text>
  <text x="301.0" y="107" text-anchor="middle" class="small">O(s) trimmed fronts, 32B AVX2</text>
  <text x="301.0" y="120" text-anchor="middle" class="small">--wfabudget (default &lt;= 2^28)</text>
  <rect x="212" y="144" width="178" height="56" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="301.0" y="162" text-anchor="middle" class="lblb" style="fill:#7c3aed">--linear (Hirschberg)</text>
  <text x="301.0" y="177" text-anchor="middle" class="small">O(|B|) rows, 16-bit + reuse</text>
  <text x="301.0" y="190" text-anchor="middle" class="small">Myers split rows (0/-1/0/-1)</text>
  <rect x="212" y="214" width="178" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="301.0" y="232" text-anchor="middle" class="lblb" style="fill:#d97706">--scoreonly</text>
  <text x="301.0" y="247" text-anchor="middle" class="small">Ukkonen-banded Myers (unit)</text>
  <text x="301.0" y="260" text-anchor="middle" class="small">or banded/MT striped SIMD</text>
  <rect x="212" y="284" width="178" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="301.0" y="302" text-anchor="middle" class="lblb" style="fill:#dc2626">smith_waterman --maxhits 1</text>
  <text x="301.0" y="317" text-anchor="middle" class="small">O(|B|) scan memory + hints</text>
  <text x="301.0" y="330" text-anchor="middle" class="small">8/16b strips or --fastlocal</text>
  <rect x="448" y="86" width="185" height="74" rx="6" fill="#f8fafc" stroke="#1b365d" stroke-width="1.4"/>
  <text x="540.5" y="104" text-anchor="middle" class="lblb" style="fill:#1b365d">1. Band Sizing &amp; Certificate</text>
  <text x="540.5" y="119" text-anchor="middle" class="small">Budgeted WFA or 12-mer probe</text>
  <text x="540.5" y="132" text-anchor="middle" class="small">Strict S_out(b) &lt; L (widen on fail)</text>
  <text x="540.5" y="145" text-anchor="middle" class="small">Excludes tied paths outside B(b)</text>
  <rect x="448" y="190" width="185" height="74" rx="6" fill="#f8fafc" stroke="#1b365d" stroke-width="1.4"/>
  <text x="540.5" y="208" text-anchor="middle" class="lblb" style="fill:#1b365d">2. Striped Diff-Encoded Fill</text>
  <text x="540.5" y="223" text-anchor="middle" class="small">1-byte/cell (12x matrix RAM cut)</text>
  <text x="540.5" y="236" text-anchor="middle" class="small">8/16-bit diff lanes + prefix-scan</text>
  <text x="540.5" y="249" text-anchor="middle" class="small">64B padded condvar MT pipeline</text>
  <rect x="668" y="86" width="176" height="74" rx="6" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="756.0" y="104" text-anchor="middle" class="lblb" style="fill:#2563eb">Strip Pruning &amp; Strip-Kept</text>
  <text x="756.0" y="119" text-anchor="middle" class="small">Upper bound U(x,y) &lt; L pruning</text>
  <text x="756.0" y="132" text-anchor="middle" class="small">Auto strip-kept if &gt;25% RAM</text>
  <text x="756.0" y="145" text-anchor="middle" class="small">1 Mb 1%: 342 MiB (exact ties)</text>
  <rect x="668" y="190" width="176" height="74" rx="6" fill="#f8fafc" stroke="#1b365d" stroke-width="1.4"/>
  <text x="756.0" y="208" text-anchor="middle" class="lblb" style="fill:#1b365d">Exact Output &amp; Fallbacks</text>
  <text x="756.0" y="223" text-anchor="middle" class="small">Byte-identical Gotoh traceback</text>
  <text x="756.0" y="236" text-anchor="middle" class="small">Unsupported -&gt; 3-matrix scalar</text>
  <text x="756.0" y="249" text-anchor="middle" class="small">--linearfallback on OOM</text>
  <path d="M 158 188 L 186 188 L 186 102 L 210 102" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 158 188 L 186 188 L 186 172 L 210 172" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 158 188 L 186 188 L 186 242 L 210 242" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 158 188 L 186 188 L 186 312 L 210 312" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 186 102 L 186 58 L 540 58 L 540 84" fill="none" stroke="#1b365d" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="364" y="53" text-anchor="middle" class="small" style="fill:#1b365d;font-weight:600">default global alignment (or --linearabove fallback)</text>
  <line x1="390" y1="102" x2="446" y2="114" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="418.0" y="102.0" text-anchor="middle" class="small">fallback</text>
  <line x1="540" y1="160" x2="540" y2="188" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="547" y="177" text-anchor="start" class="small">band ok / full</text>
  <line x1="633" y1="123" x2="666" y2="123" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="649.5" y="118.0" text-anchor="middle" class="small">strips</text>
  <line x1="633" y1="227" x2="666" y2="227" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="756" y1="160" x2="756" y2="188" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
</svg>
