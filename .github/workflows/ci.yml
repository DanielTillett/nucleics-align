name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        sanitize: ['', '1']
        native: ['']
        exclude:
          # gcc on macOS is an alias for Apple clang
          - os: macos-latest
            cc: gcc
        include:
          # -march=native: exercises the SIMD paths that need SSE4.1/AVX2
          # (plain x86-64 builds use the scalar linear-space aligner)
          - os: ubuntu-latest
            cc: gcc
            sanitize: '1'
            native: '1'
          - os: ubuntu-latest
            cc: clang
            sanitize: ''
            native: '1'
          # Linux on Arm64 (macOS runners are Arm64 too): NEON vectors,
          # without the x86 dispatch
          - os: ubuntu-24.04-arm
            cc: gcc
            sanitize: '1'
            native: ''
          - os: ubuntu-24.04-arm
            cc: clang
            sanitize: ''
            native: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build and test
        run: make CC=${{ matrix.cc }} ${{ matrix.sanitize && 'SANITIZE=1' || '' }} ${{ matrix.native && 'NATIVE=1' || '' }} all test
