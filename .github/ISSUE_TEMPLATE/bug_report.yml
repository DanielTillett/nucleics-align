name: Bug report
description: A wrong alignment or score, a crash, or an error you did not expect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting. Security problems (e.g. a crash on crafted
        input) should be reported privately instead: see SECURITY.md.
  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: The exact command line, or the library / Python / Perl call.
      render: console
      placeholder: ./bin/needleman_wunsch --printscores ACGT AGT
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The sequences (or a small file that shows the problem) and any scoring file.
      render: text
  - type: textarea
    id: got
    attributes:
      label: What happened
      description: The output, error message and exit status.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit (git rev-parse --short HEAD).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and build
      description: OS, CPU, compiler, and any make options (NATIVE=1, LANES=...).
      placeholder: Ubuntu 24.04, x86-64, gcc 13, make NATIVE=1
    validations:
      required: true
